name: Validate Registry

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Index & Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate index.json + all skill manifests
        run: python scripts/validate.py

      - name: Reachability smoke test (raw.githubusercontent)
        # 逐条校验 App 实际下载路径可 200 拉取（main 分支推送后生效）
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -e
          python3 - <<'EOF'
          import json, urllib.request, sys
          idx = json.load(open("index.json"))
          base = "https://raw.githubusercontent.com/${{ github.repository }}/main/"
          fail = 0
          for s in idx["skills"]:
              url = base + s["file"]
              try:
                  with urllib.request.urlopen(url, timeout=30) as r:
                      if r.status != 200:
                          raise SystemExit(f"HTTP {r.status}")
              except Exception as e:
                  print(f"UNREACHABLE {url}: {e}"); fail += 1
          if fail:
              sys.exit(f"{fail} 个技能文件不可达（main 分支尚未包含本次推送则属正常，重跑即过）")
          print(f"OK: {len(idx['skills'])} 个技能 raw URL 全部可达")
          EOF
